services:
  mysql:
    image: mysql:latest
    container_name:mysql_container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "shopapp"
    restart: always
    networks:
      - shopapp
  phpmyadmin:
     image: phpmyadmin/phpmyadmin
     container_name: phpmyadmin_container
     restart: always
     depends_on:
        - mysql
     ports:
        - "90:80" #port mapping
     environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
        UPLOAD_LIMIT: 500M
     networks:
        - shopapp
  networks:
      shopapp-network:
         name: shopapp
         driver: bridge
  
      
